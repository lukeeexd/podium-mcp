name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: podium-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run image
        run: |
          docker run -d --name smoke -p 18080:8080 -e PODIUM_URL=http://podium.example:3000 podium-mcp:ci
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:18080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

  # Dependabot PRs merge themselves once test and docker are green.
  automerge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge Dependabot PR
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
